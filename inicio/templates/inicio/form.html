{% extends 'base.html' %}
{% block content %}
<main>
<div class="card">
    <h2>{{ titulo }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="f">
            {% for campo in form %}
            <label>{{ campo.label }} {{ campo }}{{ campo.errors }}</label>
            {% endfor %}
        </div>
        <div class="f"><button class="b" type="submit">Guardar</button>
        <a href="{% url 'inicio:empleado_list' %}">Cancelar</a></div>
    </form>
</div>
</main>
{% endblock %}
