{% extends 'base.html' %}
{% block content %}
<main>
<div class="card">
    <h2>Contratos y finiquitos</h2>
    <form method="get" class="f">
        <label>Empleado {{ form.empleado }}{{ form.empleado.errors }}</label>
        <label>Documento {{ form.tipo }}{{ form.tipo.errors }}</label>
        <button class="b" type="submit">Generar</button>
    </form>
    {% if texto %}<pre>{{ texto }}</pre>{% endif %}
</div>
</main>
{% endblock %}
